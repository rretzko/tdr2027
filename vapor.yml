id: 75731
name: tdr2027
environments:
    production:
        domain:
          - thedirectorsroom.com
          - studentfolder.info
        memory: 1024
        cli-memory: 512
        cli-timeout: 900
        timeout: 30
        runtime: 'php-8.4:al2023'
        database: mfr-prod
        scheduler: true
        build:
            - 'composer install --no-dev --optimize-autoloader'
            - 'php artisan event:cache'
            - 'php artisan config:cache'
            - 'php artisan route:cache'
            - 'php artisan view:cache'
            - 'npm ci && npm run build && rm -rf node_modules'
    staging:
        memory: 1024
        cli-memory: 512
        cli-timeout: 900
        timeout: 30
        runtime: 'php-8.4:al2023'
        database: mfr-staging
        scheduler: false
        build:
            - 'composer install --no-dev --optimize-autoloader'
            # Staging only: SampleHonorChoirAssociationSeeder (demo data) uses model factories, which need Faker.
            - 'composer require fakerphp/faker:^1.23 --update-no-dev --optimize-autoloader --no-interaction'
            - 'php artisan event:cache'
            - 'npm ci && npm run build && rm -rf node_modules'
